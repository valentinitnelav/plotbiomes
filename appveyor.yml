# AppVeyor configuration guide for R language at https://github.com/krlmlr/r-appveyor
# appveyor.yml reference at https://www.appveyor.com/docs/appveyor-yml/
# Validate your .appveyor.yml file at https://ci.appveyor.com/tools/validate-yaml

# Notes:
#   - Minimal appveyor.yml file is an empty file. All sections are optional.
#   - Indent each level of configuration with 2 spaces. Do not use tabs!
#   - All section names are case-sensitive.
#   - Section names should be unique on each level.


# DO NOT CHANGE the "init" and "install" sections below

# Download script file from GitHub
init:
  ps: |
        $ErrorActionPreference = "Stop"
        Invoke-WebRequest http://raw.github.com/krlmlr/r-appveyor/master/scripts/appveyor-tool.ps1 -OutFile "..\appveyor-tool.ps1"
        Import-Module '..\appveyor-tool.ps1'
        Write-Host "Current Working Directory during init:" (Get-Location).Path

install:
  ps: Bootstrap

cache:
  - C:\RLibrary

before_build:
  - cmd: ECHO Current Working Directory: %CD%
  - ps: Write-Host "Current Working Directory before build:" (Get-Location).Path
  - cmd: if exist C:\projects\plotbiomes\plotbiomes.Rproj del C:\projects\plotbiomes\plotbiomes.Rproj

# Adapt as necessary starting from here

build_script:
  - travis-tool.sh install_deps

test_script:
  - travis-tool.sh run_tests

on_failure:
  - 7z a failure.zip *.Rcheck\*
  - appveyor PushArtifact failure.zip

on_success:
  - Rscript -e "covr::codecov()"

artifacts:
  - path: '*.Rcheck\**\*.log'
    name: Logs

  - path: '*.Rcheck\**\*.out'
    name: Logs

  - path: '*.Rcheck\**\*.fail'
    name: Logs

  - path: '*.Rcheck\**\*.Rout'
    name: Logs

  - path: '\*_*.tar.gz'
    name: Bits

  - path: '\*_*.zip'
    name: Bits

environment:
  matrix:
    exclude:
      - C:\projects\plotbiomes\plotbiomes.Rproj
